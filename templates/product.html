{% extends 'base.html' %}{% block title %}{{product['name']}} | 4K STORE{% endblock %}{% block content %}<div class="product-page"><div class="product-img"><img src="{{url_for('static',filename='images/'+product['image'])}}"></div><div><span class="eyebrow">{{product['category']}}</span><h1>{{product['name']}}</h1><p class="lead">{{product['description']}}</p><div class="big-price">{{'%.2f'|format(product['price'])}} ر.س</div><p>المخزون: {{product['stock']}}</p><button class="btn add-cart" data-id="{{product['id']}}">أضف إلى السلة</button></div></div>{% endblock %}
