<article class="card"><a href="{{url_for('product',pid=p['id'])}}"><div class="cover"><img src="{{url_for('static',filename='images/'+p['image'])}}" onerror="this.src='{{url_for('static',filename='images/logo.png')}}'"><span>{{p['category']}}</span></div><div class="card-body"><h3>{{p['name']}}</h3><p>{{p['description']}}</p><div class="price">{{'%.2f'|format(p['price'])}} <small>ر.س</small>{% if p['old_price'] %}<del>{{'%.2f'|format(p['old_price'])}}</del>{% endif %}</div><button type="button" class="btn add-cart" data-id="{{p['id']}}">أضف للسلة</button></div></a></article>
